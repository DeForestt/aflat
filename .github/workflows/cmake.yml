name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Test raw buffer storage
        run: python3 test/runtime/raw_buffer/run.py
      - name: Test vector storage
        run: python3 test/runtime/vector/run.py
      - name: Test deque storage
        run: python3 test/runtime/deque/run.py
      - name: Test sized types
        run: python3 test/runtime/sized_types/run.py
      - name: Test sized type formatting (uni values)
        run: python3 test/runtime/format_sized/run.py values_uni
      - name: Test sized type formatting (string values)
        run: python3 test/runtime/format_sized/run.py values_string
      - name: Test sized type formatting (narrow)
        run: python3 test/runtime/format_sized/run.py vnarrow
      - name: Test sized type formatting (signed wide)
        run: python3 test/runtime/format_sized/run.py vsigned
      - name: Test sized type formatting (unsigned wide)
        run: python3 test/runtime/format_sized/run.py vunsigned
      - name: Test sized type formatting (mixed)
        run: python3 test/runtime/format_sized/run.py mixed
      - name: Test sized type formatting (regressions)
        run: python3 test/runtime/format_sized/run.py regressions
      - name: Test integer promotion regression
        run: python3 test/runtime/format_sized/run.py promote
      - name: Test parameter deref regression
        run: python3 test/runtime/format_sized/run.py deref_param
      - name: Test sized type formatting (hand fPrint t)
        run: python3 test/runtime/format_sized/run.py hand_t.af
      - name: Test sized type formatting (hand fString t)
        run: python3 test/runtime/format_sized/run.py hand_t_str.af
      - name: Test sized type formatting (hand uni fUCstr t)
        run: python3 test/runtime/format_sized/run.py hand_t_uni.af
      - name: Test integer conversions (sign extension declarations)
        run: python3 test/runtime/conversions/run.py decl_sign_ext
      - name: Test integer conversions (literal-led declarations)
        run: python3 test/runtime/conversions/run.py decl_sign_lit
      - name: Test integer conversions (unsigned declarations)
        run: python3 test/runtime/conversions/run.py decl_unsigned
      - name: Test integer conversions (loaded declarations)
        run: python3 test/runtime/conversions/run.py decl_loaded
      - name: Test integer conversions (assignments)
        run: python3 test/runtime/conversions/run.py assign_values
      - name: Test integer conversions (field assignments)
        run: python3 test/runtime/conversions/run.py assign_fields
      - name: Test integer conversions (literal bounds)
        run: python3 test/runtime/conversions/run.py literal_bounds
      - name: Test integer conversions (diagnostics)
        run: python3 test/runtime/conversions/run.py fails
      - name: Test owned errors
        run: python3 test/runtime/errors/run.py
      - name: Build afmt
        working-directory: ${{github.workspace}}/tools/afmt
        run: |
          mkdir -p bin
          ${{github.workspace}}/bin/aflat build -o ./bin/afmt
      - name: Test afmt CLI
        run: python3 tools/afmt/src/test/cli_test.py
      - name: Test (unit, conversions)
        working-directory: ${{github.workspace}}/bin
        run: |
          set +e
          ./a.test "[conversions]" -r compact > test-out.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "FAILED:|test cases:" test-out.txt | head -20 > failures.txt
            while IFS= read -r line; do
              printf '::error title=unit test failure::%s\n' "$line"
            done < failures.txt
          fi
          exit $status
      - name: Test (unit, sized types and int types)
        working-directory: ${{github.workspace}}/bin
        run: |
          set +e
          ./a.test "[sized-types],[inttypes]" -r compact > test-out.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "FAILED:|test cases:" test-out.txt | head -20 > failures.txt
            while IFS= read -r line; do
              printf '::error title=unit test failure::%s\n' "$line"
            done < failures.txt
          fi
          exit $status
      - name: Test (unit, all other cases)
        working-directory: ${{github.workspace}}/bin
        run: |
          set +e
          ./a.test "~[conversions]~[sized-types]~[inttypes]" -r compact > test-out.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "FAILED:|test cases:" test-out.txt | head -20 > failures.txt
            while IFS= read -r line; do
              printf '::error title=unit test failure::%s\n' "$line"
            done < failures.txt
          fi
          exit $status

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check code formatting
        working-directory: ${{github.workspace}}
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' ':!:Lib/**' ':!:test/**' |
            xargs -0 -r clang-format-18 --style=file --dry-run --Werror
