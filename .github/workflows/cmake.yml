name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Test raw buffer storage
        run: python3 test/runtime/raw_buffer/run.py
      - name: Test vector storage
        run: python3 test/runtime/vector/run.py
      - name: Test deque storage
        run: python3 test/runtime/deque/run.py
      - name: Test sized types
        run: python3 test/runtime/sized_types/run.py
      - name: Test sized type formatting (uni values)
        run: python3 test/runtime/format_sized/run.py values_uni
      - name: Test sized type formatting (string values)
        if: always()
        run: python3 test/runtime/format_sized/run.py values_string
      - name: Test sized type formatting (narrow)
        if: always()
        run: python3 test/runtime/format_sized/run.py vnarrow
      - name: Test sized type formatting (signed wide)
        if: always()
        run: python3 test/runtime/format_sized/run.py vsigned
      - name: Test sized type formatting (unsigned wide)
        if: always()
        run: python3 test/runtime/format_sized/run.py vunsigned
      - name: Test sized type formatting (mixed)
        if: always()
        run: python3 test/runtime/format_sized/run.py mixed
      - name: Test sized type formatting (regressions)
        if: always()
        run: python3 test/runtime/format_sized/run.py regressions
      - name: Test sized type formatting (oracle numeric)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_num
      - name: Test sized type formatting (oracle char)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_char
      - name: Test sized type formatting (oracle empty)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_empty
      - name: Test sized type formatting (oracle literal)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_literal
      - name: Test sized type formatting (oracle zero)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_zero
      - name: Test sized type formatting (oracle i64)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_i64
      - name: Test owned errors
        run: python3 test/runtime/errors/run.py
      - name: Build afmt
        working-directory: ${{github.workspace}}/tools/afmt
        run: |
          mkdir -p bin
          ${{github.workspace}}/bin/aflat build -o ./bin/afmt
      - name: Test afmt CLI
        run: python3 tools/afmt/src/test/cli_test.py
      - name: Test
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test
      - name: Probe specifier i8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8"
      - name: Probe specifier i16
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i16"
      - name: Probe specifier i32
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i32"
      - name: Probe specifier i64
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i64"
      - name: Probe specifier u8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u8"
      - name: Probe specifier u16
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u16"
      - name: Probe specifier u32
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u32"
      - name: Probe specifier u64
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u64"
      - name: Probe specifier isize
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe isize"
      - name: Probe specifier usize
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe usize"
      - name: Probe specifier short
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe short"
      - name: Probe specifier long
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe long"
      - name: Probe specifier byte
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe byte"
      - name: Probe specifier int control
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe int control"
      - name: Probe specifier declonly i8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe declonly i8"
      - name: Probe specifier i8 as d
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as d"
      - name: Probe specifier i8 as a
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as a"
      - name: Probe specifier i8 as c
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as c"
      - name: Probe specifier usize as a
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe usize as a"
      - name: Probe control Vec3 case
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "f-strings keep owned toString results alive while formatting"

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check code formatting
        working-directory: ${{github.workspace}}
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' ':!:Lib/**' ':!:test/**' |
            xargs -0 -r clang-format-18 --style=file --dry-run --Werror
