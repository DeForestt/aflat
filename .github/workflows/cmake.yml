name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Probe len_again
        if: always()
        run: python3 test/probes/probe.py len_again
      - name: Probe len_one
        if: always()
        run: python3 test/probes/probe.py len_one
      - name: Probe hash_one_bucket
        if: always()
        run: python3 test/probes/probe.py hash_one_bucket
      - name: Probe hash_again_bucket
        if: always()
        run: python3 test/probes/probe.py hash_again_bucket
      - name: Probe hash_six_bucket
        if: always()
        run: python3 test/probes/probe.py hash_six_bucket
      - name: Probe hash_again_stable
        if: always()
        run: python3 test/probes/probe.py hash_again_stable
      - name: Probe str_at_again_4
        if: always()
        run: python3 test/probes/probe.py str_at_again_4
      - name: Probe str_at_again_0
        if: always()
        run: python3 test/probes/probe.py str_at_again_0
      - name: Probe str_comp_again
        if: always()
        run: python3 test/probes/probe.py str_comp_again
      - name: Probe char_div
        if: always()
        run: python3 test/probes/probe.py char_div
      - name: Probe char_mod
        if: always()
        run: python3 test/probes/probe.py char_mod
      - name: Probe byte_div
        if: always()
        run: python3 test/probes/probe.py byte_div
      - name: Probe map_one
        if: always()
        run: python3 test/probes/probe.py map_one
      - name: Probe map_six
        if: always()
        run: python3 test/probes/probe.py map_six
      - name: Probe map_again
        if: always()
        run: python3 test/probes/probe.py map_again
      - name: Test raw buffer storage
        run: python3 test/runtime/raw_buffer/run.py
      - name: Test vector storage
        run: python3 test/runtime/vector/run.py
      - name: Test deque storage
        run: python3 test/runtime/deque/run.py
      - name: Test owned errors
        run: python3 test/runtime/errors/run.py
      - name: Build afmt
        working-directory: ${{github.workspace}}/tools/afmt
        run: |
          mkdir -p bin
          ${{github.workspace}}/bin/aflat build -o ./bin/afmt
      - name: Test afmt CLI
        run: python3 tools/afmt/src/test/cli_test.py
      - name: Test
        working-directory: ${{github.workspace}}/bin
        run: ./a.test

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check code formatting
        working-directory: ${{github.workspace}}
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' ':!:Lib/**' ':!:test/**' |
            xargs -0 -r clang-format-18 --style=file --dry-run --Werror
