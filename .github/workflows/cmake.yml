name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Probe iso_a
        if: always()
        run: python3 test/probes/probe.py iso_a
      - name: Probe iso_b
        if: always()
        run: python3 test/probes/probe.py iso_b
      - name: Probe iso_c
        if: always()
        run: python3 test/probes/probe.py iso_c
      - name: Probe iso_d
        if: always()
        run: python3 test/probes/probe.py iso_d
      - name: Probe iso_e
        if: always()
        run: python3 test/probes/probe.py iso_e
      - name: Probe iso_f
        if: always()
        run: python3 test/probes/probe.py iso_f
      - name: Probe iso_g
        if: always()
        run: python3 test/probes/probe.py iso_g
      - name: Probe m_a
        if: always()
        run: python3 test/probes/probe.py m_a
      - name: Probe m_b
        if: always()
        run: python3 test/probes/probe.py m_b
      - name: Probe m_c
        if: always()
        run: python3 test/probes/probe.py m_c
      - name: Probe m_d
        if: always()
        run: python3 test/probes/probe.py m_d
      - name: Probe m_e
        if: always()
        run: python3 test/probes/probe.py m_e
      - name: Probe u1
        if: always()
        run: python3 test/probes/probe.py u1
      - name: Probe u2
        if: always()
        run: python3 test/probes/probe.py u2
      - name: Probe u3
        if: always()
        run: python3 test/probes/probe.py u3
      - name: Probe u4
        if: always()
        run: python3 test/probes/probe.py u4
      - name: Probe u5
