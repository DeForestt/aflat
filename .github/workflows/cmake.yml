name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Probe oswalk_s
        if: always()
        run: python3 test/probes/probe.py oswalk_s
      - name: Probe direct_main_s
        if: always()
        run: python3 test/probes/probe.py direct_main_s
      - name: Probe direct_src_main_s
        if: always()
        run: python3 test/probes/probe.py direct_src_main_s
      - name: Probe oswalk_any
        if: always()
        run: python3 test/probes/probe.py oswalk_any
      - name: Probe work_cache_dir
        if: always()
        run: python3 test/probes/probe.py work_cache_dir
      - name: Probe work_any_new_file
        if: always()
        run: python3 test/probes/probe.py work_any_new_file
      - name: Probe root_cache_main_s
        if: always()
        run: python3 test/probes/probe.py root_cache_main_s
      - name: Probe root_cache_dir
        if: always()
        run: python3 test/probes/probe.py root_cache_dir
      - name: Probe work_bin_aout
        if: always()
        run: python3 test/probes/probe.py work_bin_aout
      - name: Probe cache_main_s
        if: always()
        run: python3 test/probes/probe.py cache_main_s
      - name: Probe cache_main_s_cached
        if: always()
        run: python3 test/probes/probe.py cache_main_s_cached
      - name: Probe any_s_in_work
        if: always()
        run: python3 test/probes/probe.py any_s_in_work
      - name: Probe any_s_in_work_cached
        if: always()
        run: python3 test/probes/probe.py any_s_in_work_cached
      - name: Probe home_cache
        if: always()
        run: python3 test/probes/probe.py home_cache
      - name: Probe asm_exists
        if: always()
        run: python3 test/probes/probe.py asm_exists
      - name: Probe i64mod_cqto
        if: always()
        run: python3 test/probes/probe.py i64mod_cqto
      - name: Probe i64mod_cltd
        if: always()
        run: python3 test/probes/probe.py i64mod_cltd
      - name: Probe i64mod_movrdx
        if: always()
        run: python3 test/probes/probe.py i64mod_movrdx
      - name: Probe u64mod_xor
        if: always()
        run: python3 test/probes/probe.py u64mod_xor
      - name: Probe isize_div_cqto
        if: always()
        run: python3 test/probes/probe.py isize_div_cqto
      - name: Probe isize_cmp_setge
        if: always()
        run: python3 test/probes/probe.py isize_cmp_setge
      - name: Probe isize_cmp_setae
        if: always()
        run: python3 test/probes/probe.py isize_cmp_setae
      - name: Test raw buffer storage
        run: python3 test/runtime/raw_buffer/run.py
      - name: Test vector storage
        run: python3 test/runtime/vector/run.py
      - name: Test deque storage
        run: python3 test/runtime/deque/run.py
      - name: Test owned errors
        run: python3 test/runtime/errors/run.py
      - name: Build afmt
        working-directory: ${{github.workspace}}/tools/afmt
        run: |
          mkdir -p bin
          ${{github.workspace}}/bin/aflat build -o ./bin/afmt
      - name: Test afmt CLI
        run: python3 tools/afmt/src/test/cli_test.py
      - name: Test
        working-directory: ${{github.workspace}}/bin
        run: ./a.test

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check code formatting
        working-directory: ${{github.workspace}}
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' ':!:Lib/**' ':!:test/**' |
            xargs -0 -r clang-format-18 --style=file --dry-run --Werror
