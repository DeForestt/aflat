name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAFLAT_NATIVE_BUILD=OFF
      - name: Build compiler
        run: cmake --build build --parallel "$(nproc)"
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build stdlib
        run: bash ./rebuild-libs.sh -j "$(nproc)"
      - name: Build project
        run: ./bin/aflat build
      - name: Test raw buffer storage
        run: python3 test/runtime/raw_buffer/run.py
      - name: Test vector storage
        run: python3 test/runtime/vector/run.py
      - name: Test deque storage
        run: python3 test/runtime/deque/run.py
      - name: Test sized types
        run: python3 test/runtime/sized_types/run.py
      - name: Test sized type formatting (uni values)
        run: python3 test/runtime/format_sized/run.py values_uni
      - name: Test sized type formatting (string values)
        if: always()
        run: python3 test/runtime/format_sized/run.py values_string
      - name: Test sized type formatting (narrow)
        if: always()
        run: python3 test/runtime/format_sized/run.py vnarrow
      - name: Test sized type formatting (signed wide)
        if: always()
        run: python3 test/runtime/format_sized/run.py vsigned
      - name: Test sized type formatting (unsigned wide)
        if: always()
        run: python3 test/runtime/format_sized/run.py vunsigned
      - name: Test sized type formatting (mixed)
        if: always()
        run: python3 test/runtime/format_sized/run.py mixed
      - name: Test sized type formatting (regressions)
        if: always()
        run: python3 test/runtime/format_sized/run.py regressions
      - name: Test sized type formatting (oracle numeric)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_num
      - name: Test sized type formatting (oracle char)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_char
      - name: Test sized type formatting (oracle empty)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_empty
      - name: Test sized type formatting (oracle literal)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_literal
      - name: Test sized type formatting (oracle zero)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_zero
      - name: Test sized type formatting (oracle i64)
        if: always()
        run: python3 test/runtime/format_sized/run.py oracle_i64
      - name: Oracle iso promote char
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py iso_promote.af 65
      - name: Oracle iso deref char
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py iso_deref.af 65
      - name: Oracle iso promote short
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py iso_promote16.af 7
      - name: Oracle pa 256 healthy
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_256.af 11
      - name: Oracle pa 256 byte theory
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_256.af 10
      - name: Oracle pa neg1
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_neg1.af 20
      - name: Oracle pa neg30000
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_neg30000.af 40
      - name: Oracle pa u16
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_u16.af 50
      - name: Oracle pa byte
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_byte.af 60
      - name: Oracle pa cmp
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_cmp.af 80
      - name: Oracle pa sub
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_sub.af 92
      - name: Oracle pa long
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_long.af 70
      - name: Oracle pa u32q control
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pa_u32q.af 95
      - name: Oracle pb param char healthy
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_char.af 65
      - name: Oracle pb param char segfault
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_char.af -11
      - name: Oracle pb param char cmp
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_char_cmp.af 3
      - name: Oracle pb param char direct
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_char_direct.af 65
      - name: Oracle pb param short
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_short.af 65
      - name: Oracle pb param int control
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_param_int.af 5
      - name: Oracle pb local fn control
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py pb_local_fn.af 65
      - name: Oracle hand t segfault
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py hand_t.af -11
      - name: Oracle hand t abort
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py hand_t.af -6
      - name: Oracle hand t fpe
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py hand_t.af -8
      - name: Oracle ph uni plain
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_uni_plain.af 70
      - name: Oracle ph uni d
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_uni_d.af 72
      - name: Oracle ph uni c
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_uni_c.af 74
      - name: Oracle ph uni t cmp
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_uni_t_cmp.af 76
      - name: Oracle ph fprint t ret
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_fprint_t_ret.af 42
      - name: Oracle ph fprint d ret
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_fprint_d_ret.af 43
      - name: Oracle ph fprint w ret
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py ph_fprint_w_ret.af 44
      - name: Oracle hand fPrint c
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py hand_c.af 0
      - name: Oracle hand fPrint w
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py hand_w.af 0
      - name: Build only oracle_num
        if: always()
        run: python3 test/runtime/format_sized/run_buildonly.py oracle_num.af
      - name: Build only hand_t
        if: always()
        run: python3 test/runtime/format_sized/run_buildonly.py hand_t.af
      - name: Build only hand_t_str
        if: always()
        run: python3 test/runtime/format_sized/run_buildonly.py hand_t_str.af
      - name: Build only hand_t_uni
        if: always()
        run: python3 test/runtime/format_sized/run_buildonly.py hand_t_uni.af
      - name: Build only vnarrow
        if: always()
        run: python3 test/runtime/format_sized/run_buildonly.py vnarrow.af
      - name: Test sized type formatting (hand fPrint t)
        if: always()
        run: python3 test/runtime/format_sized/run.py hand_t
      - name: Test sized type formatting (hand fString t)
        if: always()
        run: python3 test/runtime/format_sized/run.py hand_t_str
      - name: Test sized type formatting (hand uni fUCstr t)
        if: always()
        run: python3 test/runtime/format_sized/run.py hand_t_uni
      - name: Oracle len8 is 4
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len8.af 4
      - name: Oracle len8 is 3
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len8.af 3
      - name: Oracle len8 is 2
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len8.af 2
      - name: Oracle len8 is 5
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len8.af 5
      - name: Oracle b2_8 is 54
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_b2_8.af 54
      - name: Oracle b2_8 is 0
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_b2_8.af 0
      - name: Oracle len16 is 7
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len16.af 7
      - name: Oracle len16 is 2
        if: always()
        run: python3 test/runtime/format_sized/run_oracle.py oracle_len16.af 2
      - name: Test owned errors
        run: python3 test/runtime/errors/run.py
      - name: Build afmt
        working-directory: ${{github.workspace}}/tools/afmt
        run: |
          mkdir -p bin
          ${{github.workspace}}/bin/aflat build -o ./bin/afmt
      - name: Test afmt CLI
        run: python3 tools/afmt/src/test/cli_test.py
      - name: Test
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test
      - name: Probe specifier i8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8"
      - name: Probe specifier i16
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i16"
      - name: Probe specifier i32
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i32"
      - name: Probe specifier i64
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i64"
      - name: Probe specifier u8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u8"
      - name: Probe specifier u16
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u16"
      - name: Probe specifier u32
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u32"
      - name: Probe specifier u64
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe u64"
      - name: Probe specifier isize
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe isize"
      - name: Probe specifier usize
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe usize"
      - name: Probe specifier short
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe short"
      - name: Probe specifier long
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe long"
      - name: Probe specifier byte
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe byte"
      - name: Probe specifier int control
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe int control"
      - name: Probe specifier declonly i8
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe declonly i8"
      - name: Probe specifier i8 as d
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as d"
      - name: Probe specifier i8 as a
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as a"
      - name: Probe specifier i8 as c
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe i8 as c"
      - name: Probe specifier usize as a
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "fstring specifier probe usize as a"
      - name: Probe control Vec3 case
        if: always()
        working-directory: ${{github.workspace}}/bin
        run: ./a.test "f-strings keep owned toString results alive while formatting"

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check code formatting
        working-directory: ${{github.workspace}}
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' ':!:Lib/**' ':!:test/**' |
            xargs -0 -r clang-format-18 --style=file --dry-run --Werror
